name: Documentation

on:
  pull_request:
    paths:
      - "docs/**"
      - "voxelcraft/**"
      - "zensical.toml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  push:
    paths:
      - "docs/**"
      - "voxelcraft/**"
      - "zensical.toml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install documentation dependencies
        run: uv sync --only-group docs --frozen
      - name: Build documentation
        run: uv run --only-group docs --frozen zensical build --strict
